# TraceFox agent configuration
server_host=127.0.0.1
server_port=9000
interval=5
# Optional host label attached to all metrics
host_label=
# Optional interface filter (e.g. eth0)
interface=
# Optional temperature sensor path
# temp_path=/sys/class/thermal/thermal_zone0/temp
# Set process-name prefixes to enable process metrics (comma-separated list)
proc_prefix=
# Thread collection is scoped to proc_prefix. Modes: off, summary, top.
# When proc_prefix is set, the default mode is top with five thread-name groups.
thread_mode=top
thread_top_n=5
# Enabling TID labels is intended for short-lived diagnostics only.
thread_include_tid=false
